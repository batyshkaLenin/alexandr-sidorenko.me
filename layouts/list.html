{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<ul class="publication-list">
  {{ range .Pages.ByDate.Reverse }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time>
  </li>
  {{ end }}
</ul>
{{ end }}
