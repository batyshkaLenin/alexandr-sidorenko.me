{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<ul class="publication-list h-feed">
  {{ range .Pages.ByDate.Reverse }}
  <li class="h-entry">
    <a class="u-url p-name" href="{{ .RelPermalink }}">{{ .Title }}</a>
    <time class="dt-published" datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date | time.Format ":date_long" }}</time>
  </li>
  {{ end }}
</ul>
{{ end }}
