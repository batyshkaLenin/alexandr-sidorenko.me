{{- /* Shared post-body: updated note + topics. Sit in the reading measure. */ -}}
<div class="dc-article__tail">
{{ partial "publication/updated.html" . }}
{{ with .GetTerms "tags" }}
<ul class="tags">
  {{ range . }}
  <li class="p-category"><a href="{{ partial "canonical-url.html" .RelPermalink }}" rel="tag">{{ .LinkTitle }}</a></li>
  {{ end }}
</ul>
{{ end }}
</div>
