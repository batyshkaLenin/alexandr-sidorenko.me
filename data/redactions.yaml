# Ledger of redaction decisions (S17). Written by the `redaction` skill, one
# entry per fragment the owner has ruled on, so a later pass asks only about
# what is new.
#
# Keys are Russian because this file is read by the owner far more often than
# by a template; nothing in the build depends on it.
#
# редакция_правил — which edition of
# .agents/skills/redaction/references/rules.md the decision was made under.
# When the rules get a new edition, old entries stay as they are: they record
# what was decided then, not what the current rules would say.
#
# Entry fields:
#   id             — matches the `id` of the {{< redacted >}} shortcode
#                    (решение: вымарано) or names the kept fragment.
#   файл           — path of the publication.
#   поле           — `тело`, `description` or `cover_alt`.
#   повод          — П1…П4 from the rulebook.
#   решение        — `вымарано` or `оставлено`.
#   длина          — characters redacted (решение: вымарано only).
#   фрагмент       — the text left in place, verbatim (решение: оставлено
#                    only). A redacted original is never written here: it
#                    would defeat the whole point of removing it.
#   основание      — one line on why, in the owner's terms.
#   дата_проверки  — when the decision was made.
#
# The redacted original itself lives only in the private vault —
# never here and never in this repository.
#
записи:
  - id: skver-01
    файл: content/creativity/skver.md
    поле: тело
    повод: П1
    решение: вымарано
    длина: 45
    основание: >-
      Назван инструмент употребления и признак подготовки. Владелец выбрал
      самую узкую вымарку, убирающую носитель целиком; сцена с дворником и
      причина не ходить в тот двор остались.
    дата_проверки: 2026-08-14
    редакция_правил: 2

  - id: 23-01
    файл: content/creativity/23.md
    поле: cover_alt + обложка
    повод: П3
    решение: вымарано
    основание: >-
      Вымарывается только слур, и в двух местах сразу. В alt форма — не блоки,
      а помета в тексте: alt никогда не показывается, его только читают вслух,
      и U+2588 там не несёт визуального смысла, а лишь портит озвучивание.
      Начало надписи сохранено, потому что оно есть на снимке и описывает его.
      На самой фотографии слово закрыто владельцем в графическом редакторе.
      Отступление от раздела «Изображения» свода: там способ — пикселизация, а
      свод для носителя риска требует сплошной маски, кадрирования или удаления
      и прямо называет пикселизацию визуальной цензурой, а не удалением.
      Владелец выбрал её сознательно 14 августа 2026 года; вопрос закрыт и при
      следующем проходе не поднимается.
    дата_проверки: 2026-08-14
    редакция_правил: 2
