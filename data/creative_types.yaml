# Material types. The key is what front matter stores, kebab-case.
# Chrome — status bar and `dc-list__type` — prints `upper` of that key (T169).
# Type-page headings (`Статьи`) are the page `.Title` from content/types/*.md,
# not these labels. `label` / `label_plural` are unused by templates until
# T191 says otherwise; they are not a second source of truth for chrome.
#
# `album` is absent on purpose: it is a future type with no material behind it.
# `family` picks the colour token: one hue per broad family. The subtype
# in chrome is the uppercased key, not `label`.
note:
  label: "Заметка"
  label_plural: "Заметки"
  family: knowledge
article:
  label: "Статья"
  label_plural: "Статьи"
  family: knowledge
paper:
  label: "Научная работа"
  label_plural: "Научные работы"
  family: knowledge
fiction:
  label: "Проза"
  label_plural: "Проза"
  family: literary
poem:
  label: "Стих"
  label_plural: "Стихи"
  family: literary
poetry-collection:
  label: "Подборка стихов"
  label_plural: "Подборки стихов"
  family: literary
track:
  label: "Трек"
  label_plural: "Треки"
  family: audio
