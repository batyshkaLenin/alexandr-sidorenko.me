# Публичная форма identities остаётся открытым вопросом T13
# (.ai/adr/redesign-author-identities-deferred.md), но авторство по типу
# контента владелец зафиксировал явно (T33, 2026-08-07): стихи и рассказы —
# личное авторство Александра Сидоренко (тот же публичный batyshkaLenin,
# отдельный псевдоним "unborned" для них не нужен); музыка (синглы/EP/
# альбомы) публикуется под именем проекта "ППН" отдельно от личного
# username — подача вроде "исполнитель × название группы".

batyshkaLenin:
  name: "Александр Сидоренко"
  username: "batyshkaLenin"
  city: "Новосибирск"
  country: "Россия"
  avatar: "/avatar.jpg"
  avatar_alt: "Александр Сидоренко в мексиканской шляпе и с банджо в руках"
  note: >-
    Программист, усопший вождь, взломщик. Участник хакатонов и CTF.
  used_for: ["posts", "creativity: poem/poetry/story"]
  # Полный список rel=me — data/links.yaml (там же единственный источник
  # правды, чтобы не расходиться с этим списком).

ppn:
  name: "ППН"
  # Пока нет отдельного avatar/логотипа проекта — не подставлять
  # /avatar.jpg по умолчанию, это личное фото Александра, а ППН — не он
  # лично, а музыкальный проект. Открытый вопрос до T13/появления
  # реальной обложки: byline.html должен уметь работать без avatar.
  avatar: ""
  avatar_alt: ""
  # Публичного username/handle для ППН нет — byline.html должен уметь
  # работать без username (не показывать пустой "@").
  username: ""
  note: >-
    Музыкальный проект Александра Сидоренко — синглы, EP, альбомы.
  used_for: ["creativity: single/ep/album"]
  # rel=me/ссылки на профиль ППН — открытый вопрос T13. SoundCloud-профиль
  # (soundcloud.com/better_not_be_born), ранее привязанный глобально к
  # footer, владелец удалил (аккаунт закрыт) — не переносить его сюда.
