# Each warning carries two forms: `label` — a short category name for list
# cards, which must name the category and never the plot; `text` — the full
# disclaimer shown on the publication itself and in feeds (T36 contract).
"18":
  label: "18+"
  text: "Материал предназначен для лиц старше 18 лет."
religion:
  label: "религия"
  text: >-
    Данное сообщение (материал), описывает душевные терзания разочарованного в
    жизни человека, выполняющим функции лирического героя и не несёт в себе
    цели оскорбления чувств верующих. Если вы чувствительны к этой теме
    немедленно прекратите чтение страницы и закройте вкладку браузера.
addict:
  label: "зависимости"
  text: >-
    В данном материале упомянуты реалистичные сцены употребления алкоголя,
    табачных изделий и (или) других наркотических или психоактивных веществ.
    Их употребление опасно для здоровья и (или) запрещено законом.
deepl:
  label: "машинный перевод"
  text: "Этот текст был переведен DeepL с неродного для меня языка."
