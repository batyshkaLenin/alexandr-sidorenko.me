# The closed set of signs the interface uses. One sign, one meaning,
# site-wide — the vocabulary exists so the TUI language does not sprawl.
#
# Three rules hold for every entry:
#   1. a sign is never the only carrier of meaning — text, aria-label or title
#      always says the same thing;
#   2. box-drawing is decoration and stays hidden from assistive technology;
#   3. ASCII is preferred where Unicode may not render (`>`, `<>`, `$`).
#
# `text` is what a reader gets instead of the sign when the sign cannot speak
# for itself. Capability markers are rendered by the library row; their
# text form doubles as the filter name (`has:audio`).

navigation:
  ">":
    meaning: "current or selected list item"
    text: "current"
  "←":
    meaning: "back to parent context"
    text: "back"
  "→":
    meaning: "go further: open, original, download"
    text: "open"
  "↗":
    meaning: "external link, leaves the site"
    text: "external link"

structure:
  "│ ├":
    meaning: "tree decoration"
    text: ""
    decorative: true
  "●":
    meaning: "timeline event"
    text: ""
    decorative: true
  "·":
    meaning: "metadata separator"
    text: ""
    decorative: true
  "$":
    meaning: "prompt: a command follows"
    text: ""
    decorative: true
  "/":
    meaning: "search (enhancement, appears only with JavaScript)"
    text: "search"

capabilities:
  # Keyed by the capability itself, so a row can go
  # from "this material has audio" to its marker without a second lookup table.
  audio:
    glyph: "♪"
    meaning: "has audio"
    text: "has:audio"
  math:
    glyph: "ƒ"
    meaning: "has math"
    text: "has:math"
  code:
    glyph: "<>"
    meaning: "has code"
    text: "has:code"
  image:
    glyph: "▣"
    meaning: "has images"
    text: "has:image"
  gallery:
    glyph: "▣"
    meaning: "has a gallery"
    text: "has:gallery"
  video:
    glyph: "▶"
    meaning: "has video"
    text: "has:video"
