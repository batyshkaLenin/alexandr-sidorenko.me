# The closed set of signs the interface uses. One sign, one meaning,
# site-wide — the vocabulary exists so the TUI language does not sprawl.
#
# Three rules hold for every entry:
#   1. a sign is never the only carrier of meaning — text, aria-label or title
#      always says the same thing;
#   2. box-drawing is decoration and stays hidden from assistive technology;
#   3. ASCII is preferred where Unicode may not render (`>`, `<>`, `$`).
#
# `text` is what a reader gets instead of the sign when the sign cannot speak
# for itself. Capability markers are rendered by the library row; their
# text form doubles as the filter name (`has:audio`).

navigation:
  ">":
    meaning: "текущий или выбранный элемент списка"
    text: "текущий"
  "←":
    meaning: "возврат в родительский контекст"
    text: "назад"
  "→":
    meaning: "переход дальше: открыть, оригинал, скачать"
    text: "открыть"
  "↗":
    meaning: "внешняя ссылка, уводит с сайта"
    text: "внешняя ссылка"

structure:
  "│ ├":
    meaning: "декор дерева"
    text: ""
    decorative: true
  "●":
    meaning: "событие на таймлайне"
    text: ""
    decorative: true
  "·":
    meaning: "разделитель метаданных"
    text: ""
    decorative: true
  "$":
    meaning: "prompt: дальше идёт команда"
    text: ""
    decorative: true
  "/":
    meaning: "поиск (улучшение, появляется только с JavaScript)"
    text: "поиск"

capabilities:
  # Keyed by the capability itself, so a row can go
  # from "this material has audio" to its marker without a second lookup table.
  audio:
    glyph: "♪"
    meaning: "есть аудио"
    text: "has:audio"
  math:
    glyph: "ƒ"
    meaning: "есть математика"
    text: "has:math"
  code:
    glyph: "<>"
    meaning: "есть код"
    text: "has:code"
  image:
    glyph: "▣"
    meaning: "есть изображения"
    text: "has:image"
  gallery:
    glyph: "▣"
    meaning: "есть галерея"
    text: "has:gallery"
  video:
    glyph: "▶"
    meaning: "есть видео"
    text: "has:video"
