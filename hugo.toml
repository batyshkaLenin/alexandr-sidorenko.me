baseURL = 'https://alexandr-sidorenko.me/'
locale = 'ru-RU'
# Hugo's i18n bundle selection (theme UI strings) follows this key, not
# `locale` — without it the theme's Russian i18n/ru.yaml is never picked and
# English theme strings leak through despite the site being Russian-only.
defaultContentLanguage = 'ru'
title = 'Александр Сидоренко'
# Literal range, never a computed year: a static page must not claim a year
# the build happened to run in.
copyright = '© 2020–2026 · Александр Сидоренко'
enableGitInfo = true
enableEmoji = false
enableRobotsTXT = true
theme = 'declassified'

[params]
  # The author lives in data/authors.yaml, on the entry flagged `site_owner`.
  description = 'Заметки, статьи, стихи, проза и музыка Александра Сидоренко.'
  # owner/name, not a URL: Hugo parses URL-shaped params as url.URL and
  # stringifies them to the path, which would turn the repo into `/`.
  github_repo = 'batyshkaLenin/alexandr-sidorenko.me'

# Home and Library are the whole of the navigation.
# Names are lowercase English because the menu is shell, not document.
# Titles of the pages themselves stay Russian.
[[menus.main]]
  name = 'home'
  pageRef = '/'
  weight = -1

[[menus.main]]
  name = 'library'
  pageRef = '/library'
  weight = 1

[taxonomies]
  tag = 'tags'

# Topics is a secondary, cross-cutting view inside the Library, same as Types:
# its address should read that way too, not sit at the top level.
[permalinks.taxonomy]
  tags = '/library/topics/'
[permalinks.term]
  tags = '/library/topics/:slug/'

# Explicit front-matter lastmod wins; git commit date is only a fallback
# when a page has none. Without this, enableGitInfo makes Hugo prefer
# :git over front matter, silently overriding real lastmod values with
# commit dates.
[frontmatter]
  lastmod = ['lastmod', ':git', ':default']

[outputs]
  home = ['html', 'rss', 'jsonfeed', 'llms', 'redirects', 'searchindex']
  section = ['html', 'rss', 'jsonfeed']
  page = ['html']
  taxonomy = ['html']
  # A topic is a real address someone can follow, so it carries feeds like any
  # other list of materials. Types get theirs per page, declared in
  # content/types/*.md, because they are pages rather than a taxonomy.
  term = ['html', 'rss', 'jsonfeed']

[mediaTypes.'application/feed+json']
  suffixes = ['json']

# Cloudflare wants a file named exactly `_redirects`, no extension, so the
# media type carries no suffix at all.
[mediaTypes.'text/netlify']
  suffixes = []
  delimiter = ''

[outputFormats.rss]
  mediaType = 'application/rss+xml'
  baseName = 'feed'
  isPlainText = true

[outputFormats.jsonfeed]
  mediaType = 'application/feed+json'
  baseName = 'feed'
  isPlainText = true
  rel = 'alternate'

# /llms.txt. Markdown body served as text/plain, which is what the
# convention asks for and what a reader gets when they open it in a browser.
# Home only: the file is one map of the whole site, not a per-section feed.
[outputFormats.llms]
  mediaType = 'text/plain'
  baseName = 'llms'
  isPlainText = true

# /search-index.json: what the theme's search palette searches. Home
# only — one index for the whole site, built with it rather than
# assembled in the browser.
[outputFormats.searchindex]
  mediaType = 'application/json'
  baseName = 'search-index'
  isPlainText = true
  notAlternative = true

# /_redirects: the identity resolver plus the canonical-slash rule.
# Generated rather than kept in static/, because one rule per material has to
# follow the materials.
[outputFormats.redirects]
  mediaType = 'text/netlify'
  baseName = '_redirects'
  isPlainText = true
  notAlternative = true

[minify]
  disableXML = true

# Every published photograph is a resized derivative, never the source file.
# Lanczos is the sharpest of Hugo's resample filters and the extra build
# time is irrelevant for nine images.
#
# `exif.disableLatLong` is belt-and-braces: camera metadata is already stripped
# from the sources, and Hugo's derivatives carry none of it anyway,
# but nothing here should be able to read a coordinate back out of a source
# that some future commit adds without running the stripper.
[imaging]
  quality = 82
  resampleFilter = 'Lanczos'
  anchor = 'Center'

  [imaging.exif]
    disableLatLong = true

  # No [imaging.avif] block, because nothing here encodes AVIF — see
  # `layouts/_partials/responsive-image.html` for the measurement that chose
  # WebP over it.
  [imaging.webp]
    quality = 80

[markup.goldmark.renderer]
  unsafe = false

# An image alone on its line is a figure, and a <figure> inside a <p> is markup
# no parser accepts: the browser closes the paragraph early and leaves an empty
# one behind. Off, the hook receives .IsBlock = true and owns the block itself.
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

# Chroma emits classes instead of inline style attributes. The default
# (noClasses = true) would put a style="" on every token and force
# 'unsafe-inline' into style-src — a wider CSP hole than the fonts.
# Colors live in site.css.
[markup.highlight]
  noClasses = false
  lineNumbersInTable = false

# Math is rendered at build time: goldmark hands the delimited
# source through untouched, and `layouts/_markup/render-passthrough.html` turns
# it into MathML. No client-side renderer is involved.
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    # Only `$$ … $$` opens a display formula. The other common pair, `\[ … \]`,
    # would swallow an escaped square bracket in ordinary prose — the fixture's
    # `\[скобки\]` was parsed as mathematics the moment it was enabled.
    block = [['$$', '$$']]
    inline = [['\(', '\)']]
