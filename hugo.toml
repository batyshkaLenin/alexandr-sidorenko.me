baseURL = 'https://alexandr-sidorenko.me/'
locale = 'ru-RU'
# Hugo's i18n bundle selection (theme UI strings) follows this key, not
# `locale` — without it the theme's Russian i18n/ru.yaml is never picked and
# English theme strings leak through despite the site being Russian-only
# (audit finding A16, confirmed while wiring the theme in T26).
defaultContentLanguage = 'ru'
title = 'Александр Сидоренко'
# Literal range, never a computed year (audit-only A05): a static page must not
# claim a year the build happened to run in.
copyright = '© 2020–2026 · Александр Сидоренко'
enableGitInfo = true
enableEmoji = false
enableRobotsTXT = true
theme = 'declassified'

[params]
  # The author lives in data/authors.yaml, on the entry flagged `site_owner`.
  description = 'Блог и творчество Александра Сидоренко: заметки и статьи о разработке, музыке и жизни.'

[[menus.main]]
  name = 'Главная'
  pageRef = '/'
  weight = -1

[[menus.main]]
  name = 'Блог'
  pageRef = '/posts'
  weight = 1

[[menus.main]]
  name = 'Творчество'
  pageRef = '/creativity'
  weight = 2

[taxonomies]
  tag = 'tags'

# Explicit front-matter lastmod wins; git commit date is only a fallback
# when a page has none. Without this, enableGitInfo makes Hugo prefer
# :git over front matter, silently overriding real lastmod values with
# commit dates — the exact "sitemap lastmod tied to build" bug the
# migration is meant to fix (01-current-site-audit.md §7).
[frontmatter]
  lastmod = ['lastmod', ':git', ':default']

[outputs]
  home = ['html', 'rss', 'jsonfeed', 'llms']
  section = ['html', 'rss', 'jsonfeed']
  page = ['html']
  taxonomy = ['html']
  term = ['html']

[mediaTypes.'application/feed+json']
  suffixes = ['json']

[outputFormats.rss]
  mediaType = 'application/rss+xml'
  baseName = 'feed'
  isPlainText = true

[outputFormats.jsonfeed]
  mediaType = 'application/feed+json'
  baseName = 'feed'
  isPlainText = true
  rel = 'alternate'

# /llms.txt (T67). Markdown body served as text/plain, which is what the
# convention asks for and what a reader gets when they open it in a browser.
# Home only: the file is one map of the whole site, not a per-section feed.
[outputFormats.llms]
  mediaType = 'text/plain'
  baseName = 'llms'
  isPlainText = true

[minify]
  disableXML = true

[markup.goldmark.renderer]
  unsafe = false

# Chroma emits classes instead of inline style attributes. The default
# (noClasses = true) would put a style="" on every token and force
# 'unsafe-inline' into style-src — a wider CSP hole than the fonts
# (ADR redesign-external-resources-contract, п.3). Colors live in site.css.
[markup.highlight]
  noClasses = false
  lineNumbersInTable = false
