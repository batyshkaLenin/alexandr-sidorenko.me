# Site-owned overrides and additions to the theme's i18n bundle (T53).
# notFoundTitle stays a plain human sentence because it is also the <title>
# of the 404 response; the terminal line from the mockup lives in its own key.
notFoundTitle:
  other: "Страница не найдена"
notFoundCommand:
  other: "404: bash: cd: no such file or directory"
notFoundPanelLabel:
  other: "$ cd ./unknown"
notFoundHome:
  other: "← вернуться на $ ~"
notFoundSectionsLabel:
  other: "$ ls /"
revealWarnedText:
  other: "показать текст"
hideWarnedText:
  other: "скрыть текст"
warningsContains:
  other: "содержит"
headingAnchor:
  other: "Ссылка на этот раздел"
navKeysHint:
  other: "1/2/3 — разделы · Esc — назад"
