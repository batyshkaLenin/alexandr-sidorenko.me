# Site-owned i18n. The site language stays `ru` so dates and publication copy
# remain Russian. Chrome — status bar, help, search, prompt, nav hints — is
# English (T169, 2026-09-13): the app speaks English, the documents speak
# Russian. English counts (material/topic/line/minute) live in
# layouts/_partials/en-count.html — Hugo's ru plural slots would say
# "21 material".
#
# notFoundTitle stays a plain human sentence because it is also the <title>
# of the 404 response; the terminal line from the mockup lives in its own key.
